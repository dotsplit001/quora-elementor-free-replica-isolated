<div class="q-preorder-overlay" data-preorder-modal hidden aria-hidden="true">
  <div class="q-preorder-scrim" data-preorder-dismiss aria-hidden="true"></div>
  <section class="q-preorder-dialog" role="dialog" aria-modal="true" aria-labelledby="q-preorder-title" tabindex="-1">
    <div class="q-preorder-visual">
      <img src="__QUORA_ASSET_BASE__preorder-modal.jpeg" alt="">
      <p>Just as capable as you</p>
    </div>
    <div class="q-preorder-content">
      <header class="q-preorder-header">
        <button class="q-preorder-back" type="button" data-preorder-close>
          <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M168,48V208a8,8,0,0,1-13.66,5.66l-80-80a8,8,0,0,1,0-11.32l80-80A8,8,0,0,1,168,48Z"/></svg>
          <span>Back</span>
        </button>
        <p id="q-preorder-title">Pre order now</p>
      </header>
      <form class="q-preorder-form" data-preorder-form>
        <label>
          <span class="q-preorder-field-label">Name</span>
          <input type="text" name="Name" autocomplete="name" placeholder="Jane Smith" required>
        </label>
        <label>
          <span class="q-preorder-field-label">Email</span>
          <input type="email" name="Email" autocomplete="email" placeholder="jane@quora.com" required>
        </label>
        <label>
          <span class="q-preorder-field-label">Country</span>
          <select name="Country">
            <option value="" disabled selected>Country</option>
            <option value="france">France</option>
            <option value="united-states">United States</option>
            <option value="germany">Germany</option>
            <option value="brasil">Brasil</option>
          </select>
        </label>
        <label>
          <span class="q-preorder-field-label">Model</span>
          <select name="Model">
            <option value="" disabled selected>Model</option>
            <option value="airbeat">AirBeat</option>
            <option value="proaudio">ProAudio</option>
          </select>
        </label>
        <label>
          <span class="q-preorder-field-label">Note</span>
          <textarea name="Note" placeholder="Your message"></textarea>
        </label>
        <button class="q-preorder-submit" type="submit">
          <span data-preorder-submit-label>Submit</span>
          <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>
        </button>
      </form>
      <div class="q-preorder-availability">
        <p><strong>In production</strong>, ships Q3 2025</p>
        <span class="q-preorder-countdown" aria-label="00 days, 00 hours, 00 minutes and 00 seconds remaining">00:00:00:00</span>
      </div>
    </div>
  </section>
</div>
